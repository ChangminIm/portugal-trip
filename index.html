.hero{background:var(--azulejo);color:#fff;padding:26px 0 22px;position:relative;overflow:hidden}

.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#bcd4f0;font-weight:600}

.h-label{font-family:Fraunces,serif;font-size:19px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}

.grid{display:grid;gap:8px}
.info{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px}
.info .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.info .route{font-weight:600}.info .when{color:var(--muted);font-size:12px;white-space:nowrap}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.day{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.day-head{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;width:100%;text-align:left;background:none;border:0;font:inherit;color:inherit}

.date-badge .w{font-size:11px;color:var(--muted);margin-top:3px}
.day-head .title{flex:1;min-width:0}
.day-head .title .t{font-weight:600;font-size:15px}

.chev{flex:none;color:var(--muted);transition:transform .25s;font-size:13px}
.day.open .chev{transform:rotate(90deg)}
.day-body{display:none;border-top:1px solid var(--line);padding:6px 16px 14px}
.day.open .day-body{display:block}
.it{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:0}
.it .time{flex:none;width:54px;font-size:12px;font-weight:600;color:var(--azulejo-2);padding-top:1px;font-variant-numeric:tabular-nums}
.it .body{flex:1;min-width:0}

.it.res .name{color:var(--port)}
.stars{font-size:12px;letter-spacing:1px;color:var(--star);margin-top:2px}

.sec-body{display:none;margin-top:10px}

.tools{display:flex;justify-content:flex-end;gap:8px;align-items:center;margin:2px 0 12px;flex-wrap:wrap}

footer{margin-top:26px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}

function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function render(){
 document.getElementById("days").innerHTML=state.map((d,i)=>`<div class="day${open.has(i)?" open":""}">
 <button class="day-head" onclick="toggleDay(${i})"><span class="date-badge"><span class="d">${d.date}</span><span class="w">${d.dow}</span></span><span class="title"><span class="t">${esc(d.title)}</span><span class="wake">☀ 기상 ${d.wake}</span></span><span class="chev">▶</span></button>
 <div class="day-body">${d.items.map((it,j)=>`<div class="it${it.res?" res":""}"><div class="time">${esc(it.t)}</div><div class="body"><div class="name">${esc(it.name)}${it.s===5?'<span class="tag must">필수</span>':''}${it.res?'<span class="tag res">예약</span>':''}${it.liq?'<span class="tag liq">🍷</span>':''}<button class="rm" onclick="rm(${i},${j})">✕ 삭제</button></div>${starHtml(it.s)}<div class="desc">${esc(it.desc)}</div>${it.tip?`<div class="tip${/⚠|필수|예약/.test(it.tip)?" warn":""}">${esc(it.tip)}</div>`:""}${(it.m||it.n||it.b)?`<div class="acts">${it.m?`<a class="btn map" target="_blank" rel="noopener" href="${mapUrl(it.m)}">📍 지도</a>`:""}${it.n?`<a class="btn rev" target="_blank" rel="noopener" href="${revUrl(it.n)}">📝 후기</a>`:""}${it.b?`<a class="btn book" target="_blank" rel="noopener" href="${bookUrl(it.b)}">🎟 예약</a>`:""}</div>`:""}</div></div>`).join("")}
 <div class="add-row"><button class="add-btn" onclick="add(${i})">+ 일정 추가</button></div></div></div>`).join("");
}
function toggleDay(i){open.has(i)?open.delete(i):open.add(i);render();}
function rm(i,j){state[i].items.splice(j,1);save();render();}
function add(i){const t=prompt("시간 (예: 오후, 14:00)","오후");if(t===null)return;const name=prompt("장소/내용을 입력하세요");if(!name)return;const star=parseInt(prompt("추천도 별점 0~5 (선택)","0"),10)||0;state[i].items.push({t:t||"",name:name,s:Math.max(0,Math.min(5,star)),desc:""});open.add(i);save();render();}

 {when:"7/10",name:"도루 퀸타 (Quinta do Bomfim/Foz)",note:"투어+시음 예약 필수",m:"Quinta do Bomfim Pinhão",b:"Quinta do Bomfim Douro visit booking"},
 {when:"7/11",name:"알리안사 언더그라운드 뮤지엄 (Aliança)",note:"바이라다 시음 예약 권장",m:"Aliança Underground Museum Sangalhos",b:"Aliança Underground Museum tickets"},
 {when:"7/11",name:"조아니나 도서관 (Biblioteca Joanina)",note:"시간지정 입장 예약",m:"Joanina Library Coimbra",b:"https://visit.uc.pt"}];
document.getElementById("resv").innerHTML=reservations.map(r=>`<div class="fcard"><div class="fn"><span class="rdate">${r.when}</span>${r.name}</div><div class="fm">${r.note}</div><div class="acts"><a class="btn book" target="_blank" rel="noopener" href="${bookUrl(r.b)}">🎟 예약</a><a class="btn map" target="_blank" rel="noopener" href="${mapUrl(r.m)}">📍 지도</a></div></div>`).join("");
document.querySelectorAll(".sec-toggle").forEach(b=>b.onclick=()=>b.parentElement.classList.toggle("open"));
render();
const editBtn=document.getElementById("editBtn");
editBtn.onclick=()=>{document.body.classList.toggle("edit");editBtn.classList.toggle("on");editBtn.textContent=document.body.classList.contains("edit")?"✏️ 편집 끝":"✏️ 편집";};
document.getElementById("resetBtn").onclick=()=>{if(confirm("편집한 내용을 모두 초기화할까요?")){try{localStorage.removeItem(KEY);}catch(e){}state=JSON.parse(JSON.stringify(DAYS));render();}};
const tg=document.getElementById("toggleAll");
tg.onclick=()=>{const allOpen=open.size>=state.length;state.forEach((_,i)=>allOpen?open.delete(i):open.add(i));render();tg.textContent=allOpen?"모두 펼치기":"모두 접기";};
</script>
